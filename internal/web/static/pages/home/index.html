<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NW Kids - Home</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <!-- Tailwind local -->
    <link rel="stylesheet" href="/static/css/tailwind.css?v=bd590fa602d2">
    
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
        }
        
        /* Hide scrollbar for Chrome, Safari and Opera */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        
        /* Hide scrollbar for IE, Edge and Firefox */
        .hide-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        
        /* Card hover effect */
        .grade-card {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .grade-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }
    </style>
</head>

<body class="min-h-screen bg-white">
    <!-- Background images -->
    <div class="fixed inset-0 z-0 overflow-hidden">
        <img src="/static/img/bg-left.svg" alt="" class="absolute left-0 bottom-0 h-[300px] w-auto m:h-auto object-cover object-bottom lg:h-auto lg:w-[100%] z-10">
        <img src="/static/img/bg-right.svg" alt="" class="absolute right-0 bottom-0 h-[200px] w-auto m:h-auto object-cover object-bottom lg:h-auto lg:w-[40%] z-0">
    </div>
    
    <!-- Main Content -->
    <div class="relative z-10 min-h-screen flex flex-col">
        <div class="absolute top-6 right-6">
            <div class="relative">
                <button id="menu-button" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="kebab-menu" class="inline-flex h-11 w-11 cursor-pointer items-center justify-center rounded-full border border-slate-200 bg-white text-slate-700 shadow-sm transition hover:border-slate-300 hover:text-slate-900">
                    <span class="sr-only">Open menu</span>
                    <svg aria-hidden="true" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <rect x="3" y="4" width="14" height="2" rx="1"></rect>
                        <rect x="3" y="9" width="14" height="2" rx="1"></rect>
                        <rect x="3" y="14" width="14" height="2" rx="1"></rect>
                    </svg>
                </button>
                <div id="kebab-menu" class="absolute right-0 mt-2 hidden w-56 rounded-xl border border-slate-200 bg-white py-2 text-sm text-slate-700 shadow-lg">
                    <a id="manual-checkins-link" href="/manual-checkins" class="flex items-center justify-between px-4 py-2 font-semibold transition hover:bg-slate-50 hover:text-slate-900">
                        Manual Check-Ins
                        <span aria-hidden="true">→</span>
                    </a>
                    <a id="login-link" href="/login?next=/" class="hidden flex items-center justify-between px-4 py-2 font-semibold transition hover:bg-slate-50 hover:text-slate-900">
                        Log In
                        <span aria-hidden="true">→</span>
                    </a>
                    <a id="admin-link" href="/admin" class="hidden flex items-center justify-between px-4 py-2 font-semibold transition hover:bg-slate-50 hover:text-slate-900">
                        Admin
                        <span aria-hidden="true">→</span>
                    </a>
                    <a id="logout-link" href="/logout" class="hidden flex items-center justify-between px-4 py-2 font-semibold transition hover:bg-slate-50 hover:text-slate-900">
                        Log Out
                        <span aria-hidden="true">→</span>
                    </a>
                </div>
            </div>
        </div>
        
        <!-- Main content area -->
        <div class="flex-1 flex flex-col justify-center px-6 mb-8">
            
            <div class="flex justify-center items-center mb-6">
                <a href="/">
                    <img src="/static/img/NWKids-logo.svg" alt="NWKids Logo" class="h-20 md:h-32 w-auto">
                </a>
                <span class="text-3xl md:text-5xl font-bold ml-2">Checkout</span>
            </div>

            <div class="text-center text-lg md:text-xl text-gray-600 mb-8">
                Select department to see checkouts
            </div>
            
            <!-- Cards Container -->
            <div class="w-full max-w-6xl mx-auto">
                <div class="flex flex-col md:flex-row items-center justify-center gap-8">
                    
                    <!-- Kids Jr Card -->
                    <a href="/v1/checkins/checkouts?location_group_name=Kids Jr&checked_out_after=-31m"
                       class="grade-card w-full md:w-5/12 bg-white rounded-lg p-6 shadow-[0_0_10px_rgba(0,0,0,0.25)] border border-gray-200">
                        <div class="flex items-center md:flex-col md:items-center gap-4 md:gap-6">
                            <!-- Icon -->
                            <div class="flex-shrink-0">
                                <div class="w-16 h-16 md:w-24 md:h-24 bg-orange-100 rounded-full flex items-center justify-center">
                                    <div class="text-2xl md:text-4xl text-blue-600">👶</div>
                                </div>
                            </div>
                            
                            <!-- Title -->
                            <div class="text-left md:text-center">
                                <div class="text-2xl md:text-4xl font-bold text-gray-800">
                                    Kids Jr
                                </div>
                            </div>
                        </div>
                    </a>
                    
                    <!-- 1 - 6 Grade Card -->
                    <a href="/v1/checkins/checkouts?location_group_name=Kids&checked_out_after=-31m"
                       class="grade-card w-full md:w-5/12 bg-white rounded-lg p-6 shadow-[0_0_10px_rgba(0,0,0,0.25)] border border-gray-200">
                        <div class="flex items-center md:flex-col md:items-center gap-4 md:gap-6">
                            <!-- Icon -->
                            <div class="flex-shrink-0">
                                <div class="w-16 h-16 md:w-24 md:h-24 bg-sky-100 rounded-full flex items-center justify-center">
                                    <div class="text-2xl md:text-4xl text-green-600">👦</div>
                                </div>
                            </div>
                            
                            <!-- Title -->
                            <div class="text-left md:text-center">
                                <div class="text-2xl md:text-4xl font-bold text-gray-800">
                                    1st - 6th Grade
                                </div>
                            </div>
                        </div>
                    </a>
                    
                </div>
            </div>
            
        </div>


    </div>

    <script>
        function setupMenu() {
            const menuButton = document.getElementById("menu-button");
            const menu = document.getElementById("kebab-menu");

            if (!menuButton || !menu) {
                return;
            }

            function closeMenu() {
                menu.classList.add("hidden");
                menuButton.setAttribute("aria-expanded", "false");
            }

            function toggleMenu(event) {
                event.stopPropagation();
                const isOpen = !menu.classList.contains("hidden");
                if (isOpen) {
                    closeMenu();
                    return;
                }
                menu.classList.remove("hidden");
                menuButton.setAttribute("aria-expanded", "true");
            }

            menuButton.addEventListener("click", toggleMenu);
            menu.querySelectorAll("a").forEach((link) => {
                link.addEventListener("click", () => {
                    closeMenu();
                });
            });
            document.addEventListener("click", (event) => {
                if (menu.classList.contains("hidden")) {
                    return;
                }
                if (!menu.contains(event.target)) {
                    closeMenu();
                }
            });
            document.addEventListener("keydown", (event) => {
                if (event.key === "Escape") {
                    closeMenu();
                }
            });
        }

        async function revealAdminLink() {
            try {
                const response = await fetch("/api/session", { credentials: "same-origin" });
                const loginLink = document.getElementById("login-link");
                const logoutLink = document.getElementById("logout-link");
                const adminLink = document.getElementById("admin-link");
                if (!loginLink || !logoutLink || !adminLink) {
                    return;
                }
                if (!response.ok) {
                    loginLink.classList.remove("hidden");
                    logoutLink.classList.add("hidden");
                    return;
                }
                const data = await response.json();
                if (!data || !data.authenticated) {
                    loginLink.classList.remove("hidden");
                    logoutLink.classList.add("hidden");
                    return;
                }
                loginLink.classList.add("hidden");
                logoutLink.classList.remove("hidden");
                if (data.role === "admin") {
                    adminLink.classList.remove("hidden");
                }
            } catch (error) {
                return;
            }
        }

        setupMenu();
        revealAdminLink();
    </script>
</body>
</html>
