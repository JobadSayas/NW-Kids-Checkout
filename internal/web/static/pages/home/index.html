<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NW Kids - Home</title>
    <!-- Tailwind local -->
    <link rel="stylesheet" href="/static/css/tailwind.css">
    
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
        }
        
        /* Hide scrollbar for Chrome, Safari and Opera */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        
        /* Hide scrollbar for IE, Edge and Firefox */
        .hide-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        
        /* Card hover effect */
        .grade-card {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .grade-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }
    </style>
</head>

<body class="min-h-screen bg-white">
    <!-- Background images -->
    <div class="fixed inset-0 z-0 overflow-hidden">
        <img src="img/bg-left.svg" alt="" class="absolute left-0 bottom-0 h-[300px] w-auto m:h-auto object-cover object-bottom lg:h-auto lg:w-[100%] z-10">
        <img src="img/bg-right.svg" alt="" class="absolute right-0 bottom-0 h-[200px] w-auto m:h-auto object-cover object-bottom lg:h-auto lg:w-[40%] z-0">
    </div>
    
    <!-- Main Content -->
    <div class="relative z-10 min-h-screen flex flex-col">
        
        <!-- Main content area -->
        <div class="flex-1 flex flex-col justify-center px-6 mb-8">
            
            <div class="flex justify-center items-center mb-6">
                <img src="img/NWKids-logo.svg" alt="NWKids Logo" class="h-20 md:h-32 w-auto"> <span class="text-3xl md:text-5xl font-bold ml-2">Checkout</span>
            </div>

            <div class="text-center text-lg md:text-xl text-gray-600 mb-8">
                Select department to see checkout
            </div>
            
            <!-- Cards Container -->
            <div class="w-full max-w-6xl mx-auto">
                <div class="flex flex-col md:flex-row items-center justify-center gap-8">
                    
                    <!-- Kids Jr Card -->
                    <a href="https://www.youtube.com" target="_blank" 
                       class="grade-card w-full md:w-5/12 bg-white rounded-lg p-6 shadow-[0_0_10px_rgba(0,0,0,0.25)] border border-gray-200">
                        <div class="flex items-center md:flex-col md:items-center gap-4 md:gap-6">
                            <!-- Icon -->
                            <div class="flex-shrink-0">
                                <div class="w-16 h-16 md:w-24 md:h-24 bg-orange-100 rounded-full flex items-center justify-center">
                                    <div class="text-2xl md:text-4xl text-blue-600">👶</div>
                                </div>
                            </div>
                            
                            <!-- Title -->
                            <div class="text-left md:text-center">
                                <div class="text-2xl md:text-4xl font-bold text-gray-800">
                                    Kids Jr
                                </div>
                            </div>
                        </div>
                    </a>
                    
                    <!-- 1 - 6 Grade Card -->
                    <a href="https://www.google.com" target="_blank"
                       class="grade-card w-full md:w-5/12 bg-white rounded-lg p-6 shadow-[0_0_10px_rgba(0,0,0,0.25)] border border-gray-200">
                        <div class="flex items-center md:flex-col md:items-center gap-4 md:gap-6">
                            <!-- Icon -->
                            <div class="flex-shrink-0">
                                <div class="w-16 h-16 md:w-24 md:h-24 bg-sky-100 rounded-full flex items-center justify-center">
                                    <div class="text-2xl md:text-4xl text-green-600">👦</div>
                                </div>
                            </div>
                            
                            <!-- Title -->
                            <div class="text-left md:text-center">
                                <div class="text-2xl md:text-4xl font-bold text-gray-800">
                                    1st - 6th Grade
                                </div>
                            </div>
                        </div>
                    </a>
                    
                </div>
            </div>
            
        </div>
        

    </div>
    
    <!-- JavaScript -->
    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
