<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NW Kids Checkout</title>

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Tailwind CSS CDN -->
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <!-- Tailwind local -->
    <link rel="stylesheet" href="/static/css/tailwind.css?v=dev">

    <style>
        :root {
            --confirmed-filter: invert(48%) sepia(92%) saturate(453%) hue-rotate(88deg) brightness(94%) contrast(92%);
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* Hide scrollbar for Chrome, Safari and Opera */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* Hide scrollbar for IE, Edge and Firefox */
        .hide-scrollbar {
            -ms-overflow-style: none; /* IE and Edge */
            scrollbar-width: none; /* Firefox */
        }

        [data-confirmed-state="confirmed"] [data-confirmed-icon] {
            filter: var(--confirmed-filter);
        }

        #search-controls {
            height: 0;
            min-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: height 300ms ease-out, opacity 300ms ease-out;
        }
        #search-controls .search-controls-panel {
            transform: scaleY(0);
            transform-origin: top;
            transition: transform 300ms ease-out;
        }
        #search-controls.is-expanded {
            opacity: 1;
        }
        #search-controls.is-expanded .search-controls-panel {
            transform: scaleY(1);
        }
        @media (min-width: 768px) {
            #search-controls {
                height: auto !important;
                opacity: 1 !important;
                overflow: visible;
            }
            #search-controls .search-controls-panel {
                transform: none;
            }
        }

        @keyframes new-child-flash {
            0% { background-color: #fef08a; }
            100% { background-color: #ffffff; }
        }
        .child-card-flash {
            animation: new-child-flash 3s ease-out;
        }
    </style>

</head>

<body class="min-h-screen overflow-y-auto bg-white lg:h-screen lg:overflow-hidden">
<!-- Background images -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
    <img src="/static/img/bg-left.svg" alt=""
         class="absolute left-0 bottom-0 h-[300px] w-auto m:h-auto object-cover object-bottom lg:h-auto lg:w-[100%] z-10">
    <img src="/static/img/bg-right.svg" alt=""
         class="absolute right-0 bottom-0 h-[200px] w-auto m:h-auto object-cover object-bottom lg:h-auto lg:w-[40%] z-0">
</div>

<header class="relative flex justify-between items-center w-full z-20 px-6 py-4 lg:fixed">
    <div class="flex justify-between items-center">
        <a href="/">
            <img src="/static/img/NWKids-logo.svg" alt="NWKids Logo" class="h-16 md:h-24 w-auto">
        </a>
    </div>

    <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-4xl md:text-6xl font-bold text-gray-800">
        <span id="current-time">14:30</span>
    </div>

    <div class="hidden lg:block w-16 md:w-24"></div>

    <div class="absolute top-6 right-6 flex items-center gap-2">
        <button
            id="search-toggle-button"
            type="button"
            aria-expanded="false"
            aria-controls="search-controls"
            aria-label="Toggle search"
            class="md:hidden cursor-pointer rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 shadow-sm hover:bg-slate-50"
        >
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="h-5 w-5 transition-transform duration-300" data-search-toggle-icon>
                <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
            </svg>
        </button>

        <div class="relative">
            <button id="menu-button" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="kebab-menu" class="inline-flex h-11 w-11 cursor-pointer items-center justify-center rounded-full border border-slate-200 bg-white text-slate-700 shadow-sm transition hover:border-slate-300 hover:text-slate-900">
                <span class="sr-only">Open menu</span>
                <svg aria-hidden="true" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <rect x="3" y="4" width="14" height="2" rx="1"></rect>
                    <rect x="3" y="9" width="14" height="2" rx="1"></rect>
                    <rect x="3" y="14" width="14" height="2" rx="1"></rect>
                </svg>
            </button>
            <div id="kebab-menu" class="absolute right-0 mt-2 hidden w-56 rounded-xl border border-slate-200 bg-white py-2 text-sm text-slate-700 shadow-lg">
                <a id="manual-checkins-link" href="/manual-checkins" class="flex items-center justify-between px-4 py-2 font-semibold transition hover:bg-slate-50 hover:text-slate-900">
                    Manual Check-Ins
                    <span aria-hidden="true">→</span>
                </a>
                <a id="login-link" href="/login?next=/" class="hidden flex items-center justify-between px-4 py-2 font-semibold transition hover:bg-slate-50 hover:text-slate-900">
                    Log In
                    <span aria-hidden="true">→</span>
                </a>
                <a id="admin-link" href="/admin" class="hidden flex items-center justify-between px-4 py-2 font-semibold transition hover:bg-slate-50 hover:text-slate-900">
                    Admin
                    <span aria-hidden="true">→</span>
                </a>
                <a id="logout-link" href="/logout" class="hidden flex items-center justify-between px-4 py-2 font-semibold transition hover:bg-slate-50 hover:text-slate-900">
                    Log Out
                    <span aria-hidden="true">→</span>
                </a>
            </div>
        </div>
    </div>
</header>

<!-- Main Content -->
<div class="relative z-10 min-h-screen flex flex-col box-border lg:h-screen lg:pt-28">
    <div class="relative z-10 flex flex-col items-center gap-2 px-4 pb-2 md:pt-4 md:flex-row md:justify-center md:gap-3">
        <div id="search-controls" class="w-full max-w-md md:flex-1 md:max-w-2xl">
            <div class="overflow-hidden search-controls-panel">
                <div class="flex flex-col items-center gap-2 md:flex-row md:items-center md:gap-3">
                    <input
                        id="search-input"
                        type="search"
                        autocomplete="off"
                        placeholder="Search by name or code"
                        class="w-full rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-base shadow-sm focus:border-slate-500 focus:outline-none md:flex-1 md:min-w-0"
                    />
                    <button
                        id="toggle-confirmed-button"
                        type="button"
                        aria-pressed="false"
                        class="cursor-pointer rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-700 shadow-sm hover:bg-slate-50"
                    >
                        Hide confirmed
                    </button>
                </div>
            </div>
        </div>
    </div>
    <!-- Scrollable children list (list on mobile, grid on desktop) -->
    <div id="children-list" class="grid grid-cols-1 gap-3 px-4 py-4 md:grid-cols-2 lg:flex-1 lg:min-h-0 lg:overflow-y-auto lg:content-start lg:grid-cols-3">
        <!-- Cards will be dynamically inserted here -->
        <div class="text-center text-gray-500 py-8">
            Loading children data...
        </div>
    </div>
</div>

<script src="/static/js/morphdom-umd.min.js?v=dev"></script>
<script src="/static/pages/checkoutsv1/checkouts.js?v=dev"></script>
</body>
</html>
