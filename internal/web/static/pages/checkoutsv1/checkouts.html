<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NW Kids Checkout</title>

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Tailwind CSS CDN -->
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <!-- Tailwind local -->
    <link rel="stylesheet" href="/static/css/tailwind.css?v=dev">

    <style>
        :root {
            --confirmed-filter: invert(48%) sepia(92%) saturate(453%) hue-rotate(88deg) brightness(94%) contrast(92%);
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* Hide scrollbar for Chrome, Safari and Opera */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* Hide scrollbar for IE, Edge and Firefox */
        .hide-scrollbar {
            -ms-overflow-style: none; /* IE and Edge */
            scrollbar-width: none; /* Firefox */
        }

        [data-confirmed-state="confirmed"] [data-confirmed-icon] {
            filter: var(--confirmed-filter);
        }

        @keyframes new-child-flash {
            0% { background-color: #fef08a; }
            100% { background-color: #ffffff; }
        }
        .child-card-flash {
            animation: new-child-flash 3s ease-out;
        }
    </style>

</head>

<body class="min-h-screen overflow-y-auto bg-white lg:h-screen lg:overflow-hidden">
<!-- Background images -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
    <img src="/static/img/bg-left.svg" alt=""
         class="absolute left-0 bottom-0 h-[300px] w-auto m:h-auto object-cover object-bottom lg:h-auto lg:w-[100%] z-10">
    <img src="/static/img/bg-right.svg" alt=""
         class="absolute right-0 bottom-0 h-[200px] w-auto m:h-auto object-cover object-bottom lg:h-auto lg:w-[40%] z-0">
</div>

<header class="relative flex justify-between items-center w-full z-20 px-6 py-4 lg:fixed">
    <div class="flex justify-between items-center">
        <a href="/">
            <img src="/static/img/NWKids-logo.svg" alt="NWKids Logo" class="h-16 md:h-24 w-auto">
        </a>
    </div>

    <div class="text-4xl md:text-6xl font-bold text-gray-800 lg:absolute lg:left-1/2 lg:top-4 lg:transform lg:-translate-x-1/2">
        <span id="current-time">14:30</span>
    </div>

    <div class="hidden lg:block w-16 md:w-24"></div>
</header>

<!-- Main Content -->
<div class="relative z-10 min-h-screen flex flex-col box-border lg:h-screen lg:pt-28">
    <div class="relative z-10 flex justify-center px-4 pb-2">
        <input
            id="search-input"
            type="search"
            autocomplete="off"
            placeholder="Search by name or code"
            class="w-full max-w-md rounded-lg border border-slate-300 bg-white px-4 py-2 text-xl shadow-sm focus:border-slate-500 focus:outline-none"
        />
    </div>
    <div class="relative z-10 flex justify-center pb-2">
        <button
            id="toggle-confirmed-button"
            type="button"
            aria-pressed="false"
            class="rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-700 shadow-sm hover:bg-slate-50"
        >
            Hide confirmed
        </button>
    </div>
    <!-- Scrollable children list (list on mobile, grid on desktop) -->
    <div id="children-list" class="grid grid-cols-1 gap-3 px-4 py-4 md:grid-cols-2 lg:flex-1 lg:min-h-0 lg:overflow-y-auto lg:content-start lg:grid-cols-3">
        <!-- Cards will be dynamically inserted here -->
        <div class="text-center text-gray-500 py-8">
            Loading children data...
        </div>
    </div>
</div>

<script src="/static/js/morphdom-umd.min.js?v=dev"></script>
<script src="/static/pages/checkoutsv1/checkouts.js?v=dev"></script>
</body>
</html>
