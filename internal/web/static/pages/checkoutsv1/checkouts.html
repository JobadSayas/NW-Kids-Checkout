<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NW Kids Checkout</title>

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Tailwind CSS CDN -->
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <!-- Tailwind local -->
    <link rel="stylesheet" href="/static/css/tailwind.css?v=bd590fa602d2">

    <style>
        :root {
            --confirmed-filter: invert(48%) sepia(92%) saturate(453%) hue-rotate(88deg) brightness(94%) contrast(92%);
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* Hide scrollbar for Chrome, Safari and Opera */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* Hide scrollbar for IE, Edge and Firefox */
        .hide-scrollbar {
            -ms-overflow-style: none; /* IE and Edge */
            scrollbar-width: none; /* Firefox */
        }

        [data-confirmed-state="confirmed"] [data-confirmed-icon] {
            filter: var(--confirmed-filter);
        }
    </style>

</head>

<body class="min-h-screen overflow-y-auto bg-white lg:h-screen lg:overflow-hidden">
<!-- Background images -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
    <img src="/static/img/bg-left.svg" alt=""
         class="absolute left-0 bottom-0 h-[300px] w-auto m:h-auto object-cover object-bottom lg:h-auto lg:w-[100%] z-10">
    <img src="/static/img/bg-right.svg" alt=""
         class="absolute right-0 bottom-0 h-[200px] w-auto m:h-auto object-cover object-bottom lg:h-auto lg:w-[40%] z-0">
</div>

<header class="relative flex justify-between items-center w-full z-20 px-6 py-4 lg:fixed lg:w-8/12">
    <div class="flex justify-between items-center">
        <a href="/">
            <img src="/static/img/NWKids-logo.svg" alt="NWKids Logo" class="h-16 md:h-24 w-auto">
        </a>
    </div>

    <div class="text-4xl md:text-6xl font-bold text-gray-800 lg:absolute lg:left-1/2 lg:top-4 lg:transform lg:-translate-x-1/2">
        <span id="current-time">14:30</span>
    </div>

    <div class="hidden lg:block w-16 md:w-24"></div>
</header>

<!-- Main Content -->
<div class="relative z-10 min-h-screen flex flex-col box-border lg:h-screen lg:flex-row lg:pt-28">
    <!-- Left Panel - Currently Called (Desktop: 8/12, Mobile: full width) -->
    <div class="lg:w-8/12 lg:h-full flex items-start lg:items-center px-6 pt-1 pb-5 lg:py-0 flex-none lg:flex-none">
        <div class="w-full" id="current-child-card">
            <!-- Name -->
            <div id="current-child-name" class="font-bold text-4xl lg:text-6xl lg:text-7xl text-gray-800 mb-1 lg:mb-3">
                Loading...
            </div>

            <!-- Code, time, and confirmed -->
            <div class="flex items-center gap-4">
                <div id="current-child-code" class="text-3xl lg:text-6xl text-black mr-4">
                    ...
                </div>
                <div id="current-child-time"
                     class="text-xl lg:text-xl text-white bg-gray-400 px-2 py-0 lg:px-2 lg:py-1 rounded-md">
                    0 min ago
                </div>
                <label class="relative flex items-center cursor-pointer leading-none" data-confirmed-label data-confirmed-state="unconfirmed">
                    <input id="current-child-confirmed" type="checkbox"
                           class="sr-only child-confirmed-checkbox">
                    <span class="inline-flex">
                        <img src="/static/img/confirmed-checkbox.svg" alt="" class="h-10 w-10 block" data-confirmed-icon>
                    </span>
                </label>
            </div>
        </div>
    </div>

    <!-- Right Panel - Previously Called (Desktop: 4/12 with internal scroll, Mobile: full width) -->
    <div class="lg:w-4/12 lg:h-full min-h-0 border-t border-gray-300 lg:border-t-0 flex-none lg:flex-1">
        <div class="lg:h-full min-h-0 flex flex-col lg:px-0 lg:px-0 py-4 lg:pt-4 lg:pb-0">
            <div class="flex items-center justify-between px-4 mb-3">
                <h2 class="text-xl font-bold text-gray-800">Previously Called</h2>
            </div>

            <!-- Scrollable cards container -->
            <div id="previously-called-list" class="lg:flex-1 lg:min-h-0 overflow-visible lg:overflow-y-auto hide-scrollbar space-y-3 px-4 py-2">
                <!-- Cards will be dynamically inserted here -->
                <div class="text-center text-gray-500 py-8">
                    Loading children data...
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/static/js/morphdom-umd.min.js?v=ad1aaf5441eb"></script>
<script src="/static/pages/checkoutsv1/checkouts.js?v=62225b6a1dc9"></script>
</body>
</html>
