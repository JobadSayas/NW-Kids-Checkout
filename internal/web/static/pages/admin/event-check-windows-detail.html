<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NW Kids - Event Check Windows</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico"/>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
    <link rel="manifest" href="/manifest.webmanifest"/>
    <link rel="stylesheet" href="/static/css/tailwind.css?v=dev">
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
<div class="max-w-6xl mx-auto px-6 py-10">
    <header class="flex flex-col gap-2 mb-8">
        <div class="flex items-center gap-3">
            <a href="/admin">
                <img src="/static/img/NWKids-logo.svg" alt="NWKids Logo" class="h-16 md:h-24 w-auto">
            </a>
            <div>
                <h1 class="text-3xl font-semibold">Event Check Windows</h1>
                <p class="text-sm text-slate-600">Event: <span id="event-name" class="font-semibold">-</span></p>
                <p class="text-sm text-slate-600">Planning Center ID: <span id="event-pc-id" class="font-semibold">-</span></p>
            </div>
        </div>
    </header>

    <div id="page-status" class="hidden mb-4 rounded-md border border-slate-200 bg-white px-4 py-3 text-sm"></div>

    <div class="mb-4 flex items-center justify-between">
        <h2 class="text-lg font-semibold text-slate-900">Check Windows</h2>
        <button onclick="openAddWindow()" class="inline-flex cursor-pointer items-center gap-2 rounded-md border border-slate-800 bg-slate-800 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-slate-700">
            Add Window
        </button>
    </div>

    <div class="rounded-xl border border-slate-200 bg-white shadow-sm">
        <table class="min-w-full text-sm">
            <thead class="sticky top-0 z-10 bg-slate-100 text-left text-xs uppercase tracking-wide text-slate-600 shadow-sm">
            <tr>
                <th class="px-4 py-3">Start</th>
                <th class="px-4 py-3">End</th>
                <th class="px-4 py-3">Timezone</th>
                <th class="px-4 py-3">Actions</th>
            </tr>
            </thead>
            <tbody id="windows-body" class="divide-y divide-slate-100">
            <tr>
                <td class="px-4 py-6 text-center text-slate-500" colspan="4">Loading check windows...</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-10">
        <a href="/admin/event-check-windows" class="inline-flex items-center gap-2 text-sm font-semibold text-slate-600 hover:text-slate-900">
            <span aria-hidden="true">←</span>
            Back to event check windows
        </a>
    </div>
</div>

<!-- Modal for Add/Edit Check Window -->
<div id="window-modal" class="fixed inset-0 z-50 hidden">
    <div class="fixed inset-0 bg-black/50" onclick="closeModal()"></div>
    <div class="fixed left-1/2 top-1/2 w-full max-w-md -translate-x-1/2 -translate-y-1/2 rounded-xl bg-white p-6 shadow-xl">
        <h2 id="modal-title" class="mb-4 text-xl font-semibold">Add Check Window</h2>
        <div id="modal-status" class="hidden mb-4 rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"></div>
        <form id="window-form">
            <input type="hidden" id="window-id">
            <input type="hidden" id="event-id">
            
            <div class="mb-4">
                <label for="start-day" class="block text-sm font-medium text-slate-700">Start Day</label>
                <select id="start-day" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2">
                    <option value="1">Monday</option>
                    <option value="2">Tuesday</option>
                    <option value="3">Wednesday</option>
                    <option value="4">Thursday</option>
                    <option value="5">Friday</option>
                    <option value="6">Saturday</option>
                    <option value="7" selected>Sunday</option>
                </select>
            </div>
            
            <div class="mb-4">
                <label for="start-time" class="block text-sm font-medium text-slate-700">Start Time</label>
                <input type="text" id="start-time" placeholder="09:00" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2">
                <p class="mt-1 text-xs text-slate-500">24-hour format (e.g., 09:00, 14:30, 23:00)</p>
                <p id="start-time-error" class="mt-1 text-xs text-red-600 hidden"></p>
            </div>
            
            <div class="mb-4">
                <label for="end-day" class="block text-sm font-medium text-slate-700">End Day</label>
                <select id="end-day" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2">
                    <option value="1">Monday</option>
                    <option value="2">Tuesday</option>
                    <option value="3">Wednesday</option>
                    <option value="4">Thursday</option>
                    <option value="5">Friday</option>
                    <option value="6">Saturday</option>
                    <option value="7" selected>Sunday</option>
                </select>
            </div>
            
            <div class="mb-4">
                <label for="end-time" class="block text-sm font-medium text-slate-700">End Time</label>
                <input type="text" id="end-time" placeholder="12:00" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2">
                <p class="mt-1 text-xs text-slate-500">24-hour format (e.g., 09:00, 14:30, 23:00)</p>
                <p id="end-time-error" class="mt-1 text-xs text-red-600 hidden"></p>
            </div>
            
            <div class="mb-6">
                <label for="timezone" class="block text-sm font-medium text-slate-700">Timezone</label>
                <select id="timezone" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2">
                    <option value="America/Chicago">America/Chicago (CT)</option>
                    <option value="America/Los_Angeles">America/Los_Angeles (PT)</option>
                    <option value="America/Denver">America/Denver (MT)</option>
                    <option value="America/New_York">America/New_York (ET)</option>
                    <option value="UTC">UTC</option>
                </select>
            </div>
            
            <div class="flex justify-end gap-3">
                <button type="button" onclick="closeModal()" class="inline-flex cursor-pointer items-center gap-2 rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-600 shadow-sm transition hover:border-slate-400 hover:text-slate-900">Cancel</button>
                <button type="submit" class="inline-flex cursor-pointer items-center gap-2 rounded-md border border-slate-800 bg-slate-800 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-slate-700">Save</button>
            </div>
        </form>
    </div>
</div>

<script src="/static/pages/admin/event-check-windows-detail.js?v=dev"></script>
</body>
</html>
