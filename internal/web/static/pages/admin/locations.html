<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NW Kids - Location Admin</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico"/>
    <link rel="stylesheet" href="/static/css/tailwind.css">
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
<div class="max-w-6xl mx-auto px-6 py-10">
    <header class="flex flex-col gap-2 mb-8">
        <div class="flex items-center gap-3">
            <a href="/admin">
                <img src="/static/img/NWKids-logo.svg" alt="NWKids Logo" class="h-16 md:h-24 w-auto">
            </a>
            <h1 class="text-3xl font-semibold">Location Administration</h1>
        </div>
        <p class="text-sm text-slate-600">Manage auto-fetch settings and location group assignments.</p>
    </header>

    <div id="page-status" class="hidden mb-4 rounded-md border border-slate-200 bg-white px-4 py-3 text-sm"></div>

    <div class="rounded-xl border border-slate-200 bg-white shadow-sm">
        <table class="min-w-full text-sm">
            <thead class="sticky top-0 z-10 bg-slate-100 text-left text-xs uppercase tracking-wide text-slate-600 shadow-sm">
            <tr>
                <th class="px-4 py-3">Name</th>
                <th class="px-4 py-3">Parent</th>
                <th class="px-4 py-3">Event</th>
                <th class="px-4 py-3">Location Group</th>
                <th class="px-4 py-3">Auto Fetch</th>
            </tr>
            </thead>
            <tbody id="locations-body" class="divide-y divide-slate-100">
            <tr>
                <td class="px-4 py-6 text-center text-slate-500" colspan="5">Loading locations...</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="/static/pages/admin/locations.js"></script>
</body>
</html>
